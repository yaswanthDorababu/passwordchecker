<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login | Password Checker</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}">


</head>

<body>

<div class="auth-container">


<div class="auth-card">


    <div class="auth-logo">
        🔐
    </div>


    <h1>
        Welcome Back
    </h1>


    <p>
        Login to your Password Security account.
    </p>


    {% if error %}

    <div class="error-message">
        ⚠️ {{ error }}
    </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >


        <label for="email">
            Email
        </label>


        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            class="auth-button"
        >
            Login
        </button>


    </form>


    <p class="auth-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </p>


    <a
        href="{{ url_for('index') }}"
        class="back-home"
    >
        ← Back to Password Checker
    </a>


</div>


</div>

</body>

</html>
