<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Common Password Checker</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/common_passwords.css') }}">


</head>

<body>

<div class="container">


<h1>🔐 Common Password Checker</h1>

<p>
    Check whether your password is present
    in the common passwords database.
</p>


<form method="POST"
      action="/common-passwords">

    <label for="commonPassword">
        Enter Password
    </label>


    <div class="password-box">

        <input
            type="password"
            id="commonPassword"
            name="password"
            placeholder="Enter password"
            required
        >

        <button
            type="button"
            id="togglePassword">

            👁️

        </button>

    </div>


    <button
        type="submit"
        class="check-button">

        🔍 Check Password

    </button>

</form>


<!-- RESULT -->

{% if result %}

<div class="result-box {% if found %}common{% else %}not-common{% endif %}">

    <div class="result-icon">

        {% if found %}
            🚨
        {% else %}
            ✅
        {% endif %}

    </div>


    <h2>
        {{ result }}
    </h2>


    <p>
        {{ message }}
    </p>

</div>

{% endif %}


<a href="/dashboard"
   class="back-button">

    ← Dashboard

</a>


</div>

<script src="{{ url_for('static', filename='js/common_passwords.js') }}">
</script>

</body>

</html>
