<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account | Password Checker</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}">


</head>

<body>

<div class="auth-container">


<div class="auth-card">


    <!-- Logo -->

    <div class="logo">

        🔐

    </div>


    <h1>
        Create Account
    </h1>


    <p class="subtitle">
        Create your Password Security account
    </p>


    <!-- Error Message -->

    {% if error %}

    <div class="error-message">

        ⚠️ {{ error }}

    </div>

    {% endif %}


    <!-- Register Form -->

    <form
        method="POST"
        action="{{ url_for('register') }}"
    >


        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    id="togglePassword"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- Submit -->

        <button
            type="submit"
            class="auth-button"
        >

            Create Account

        </button>


    </form>


    <!-- Login -->

    <p class="bottom-text">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>


    <!-- Back -->

    <a
        href="/"
        class="back-link"
    >

        ← Back to Password Checker

    </a>


</div>


</div>

<script>

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


togglePassword.addEventListener(
    "click",
    function () {

        if (password.type === "password") {

            password.type = "text";

            togglePassword.textContent = "🙈";

        } else {

            password.type = "password";

            togglePassword.textContent = "👁️";

        }

    }
);

</script>

</body>

</html>
